<!DOCTYPE html>
<html>
<head>
    <title>My Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .window {
            width: 500px;
            margin: 40px auto;
            border: 2px solid #2b6cb0;
            border-radius: 5px;
        }
        .titlebar {
            background-color: #4a90d9;
            color: white;
            padding: 6px 10px;
            font-weight: bold;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        img {
            width: 100px;
            height: 80px;
            margin: 5px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="titlebar">My Gallery</div>
        <div class="content">
            <h2>MY <font color="red">PICTURE</font> GALLERY</h2>

            <a href="https://www.google.com">
                <img src="leaf.jpg" alt="Leaf">
            </a>
            <a href="https://www.yahoo.com">
                <img src="keyboard.jpg" alt="Keyboard">
            </a>
            <a href="https://www.bing.com">
                <img src="road.jpg" alt="Road">
            </a>
            <a href="https://www.youtube.com">
                <img src="rock.jpg" alt="Rock">
            </a>
        </div>
    </div>
</body>
</html>
