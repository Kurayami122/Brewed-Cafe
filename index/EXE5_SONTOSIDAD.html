<!DOCTYPE html>
<html>
<head>
    <title>Formatting Tags</title>
</head>
<body>
    <p><i>Italic</i></p>
    <p><u>Underline</u></p>
    <p><b>Bold</b></p>
    <p><strong>Strong</strong></p>
    <p><em>Emphasis</em></p>
    <p><sub>Subscript</sub></p>
    <p><sup>Superscript</sup></p>
    <p><small>Small</small></p>
    <p><mark>Marked</mark></p>
    <p><del>Deleted</del></p>
</body>
</html>
