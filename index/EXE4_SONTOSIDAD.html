<!DOCTYPE html>
<html>
<head>
    <title>Font Tag Attributes</title>
</head>
<body>
    <h1>The FONT Tag Attributes</h1>

    <font face="Arial">This text uses the Arial font face.</font><br><br>

    <font color="red">This text is colored red.</font><br><br>

    <font size="1">This is size 1</font><br>
    <font size="3">This is size 3</font><br>
    <font size="5">This is size 5</font><br>
    <font size="7">This is size 7</font><br><br>

    <font face="Courier New" color="blue" size="4">
        This text combines face, color, and size attributes together.
    </font>
</body>
</html>
