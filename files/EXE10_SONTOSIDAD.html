<!DOCTYPE html>
<html>
<head>
    <title>List Numbering Types</title>
</head>
<body>
    <p><b>Lowercase letters list:</b></p>
    <ol type="a">
        <li>Apples</li>
        <li>Bananas</li>
        <li>Lemons</li>
        <li>Oranges</li>
    </ol>

    <p><b>Roman numbers list:</b></p>
    <ol type="I">
        <li>Apples</li>
        <li>Bananas</li>
        <li>Lemons</li>
        <li>Oranges</li>
    </ol>

    <p><b>Lowercase Roman numbers list:</b></p>
    <ol type="i">
        <li>Apples</li>
        <li>Bananas</li>
        <li>Lemons</li>
        <li>Oranges</li>
    </ol>
</body>
</html>
