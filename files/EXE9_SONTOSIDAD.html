<!DOCTYPE html>
<html>
<head>
    <title>Numbered and Letter Lists</title>
</head>
<body>
    <p><b>Numbered list:</b></p>
    <ol type="1">
        <li>Apples</li>
        <li>Bananas</li>
        <li>Lemons</li>
        <li>Oranges</li>
    </ol>

    <p><b>Letters list:</b></p>
    <ol type="A">
        <li>Apples</li>
        <li>Bananas</li>
        <li>Lemons</li>
        <li>Oranges</li>
    </ol>
</body>
</html>
